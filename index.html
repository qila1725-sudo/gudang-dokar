<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#1B2430; --ink-soft:#68707C; --line:#E4E7EB;
  --accent:#C1440E; --accent-dark:#9A350D; --accent-dark2:#8E360C; --accent-soft:#FBEAE1;
  --success:#1F8A4C; --success-soft:#E5F5EA; --warning:#B5720A; --warning-soft:#FCF0DA;
  --danger:#C0392B; --danger-soft:#FBE6E3; --sidebar:#171E2B; --sidebar-soft:#232C3D;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- layout ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:238px; flex-shrink:0; background:var(--sidebar); color:#C9D0DC;
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:60;
  transition:transform .25s ease;
}
.sidebar-brand{padding:20px 18px 14px; border-bottom:1px solid #2A3446;}
.sidebar-brand .name{font-weight:800; font-size:16px; color:#fff; letter-spacing:.2px;}
.sidebar-brand .sub{font-size:11.5px; color:#8891A0; margin-top:2px;}
.sidebar-scan{margin:14px 14px 6px; background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:11px 12px; font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px; justify-content:center;}
.sidebar-scan:hover{background:var(--accent-dark2);}
.nav{flex:1; overflow-y:auto; padding:8px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13.5px;
  color:#AEB6C4; margin-bottom:2px; font-weight:500; position:relative;
}
.nav-item:hover{background:var(--sidebar-soft); color:#fff;}
.nav-item.active{background:var(--accent-soft); color:var(--accent-dark2); background:rgba(193,68,14,.16); color:#fff;}
.nav-item.active::before{content:""; position:absolute; left:-10px; top:8px; bottom:8px; width:3px; background:var(--accent); border-radius:3px;}
.nav-icon{width:17px; text-align:center; font-size:14px;}
.nav-badge{margin-left:auto; background:var(--accent); color:#fff; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;}
.sidebar-foot{padding:14px 18px; border-top:1px solid #2A3446; font-size:12px; color:#8891A0;}

.main{margin-left:238px; flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--panel); border-bottom:1px solid var(--line); padding:12px 22px; display:flex; align-items:center;
  gap:14px; position:sticky; top:0; z-index:40;
}
.hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; font-size:16px;}
.search-box{flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line);
  border-radius:8px; padding:8px 12px; color:var(--ink-soft); font-size:13px;}
.topbar-spacer{flex:1;}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:9px 14px;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.btn:hover{border-color:#c7ccd3;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-dark2); border-color:var(--accent-dark2);}
.btn-dark{background:var(--sidebar); border-color:var(--sidebar); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-sm{padding:6px 10px; font-size:12px;}
.btn-danger{background:var(--danger-soft); border-color:var(--danger-soft); color:var(--danger);}
.icon-btn{width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:15px;}
.user-chip{display:flex; align-items:center; gap:9px;}
.user-avatar{width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;}
.user-meta .n{font-size:12.5px; font-weight:700;}
.user-meta .r{font-size:11px; color:var(--ink-soft);}

.view{padding:22px; max-width:1360px; width:100%; margin:0 auto;}
.crumbs{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
h1.page-title{font-size:25px; margin:0 0 4px; font-weight:800;}
.page-desc{color:var(--ink-soft); font-size:13.5px; margin:0 0 18px; max-width:720px;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}

.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(1,1fr);}}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.stat-card .label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; font-weight:700; margin-bottom:8px;}
.stat-card .value{font-size:24px; font-weight:800; line-height:1.1;}
.stat-card .foot{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.stat-card.warn{border-color:#F0D3A8; background:var(--warning-soft);}
.stat-card.warn .value{color:var(--warning);}
.stat-card.danger{border-color:#F0C4BC; background:var(--danger-soft);}
.stat-card.danger .value{color:var(--danger);}
.stat-card.good{border-color:#BEE3CC; background:var(--success-soft);}
.stat-card.good .value{color:var(--success);}

.panel-title{font-size:15px; font-weight:800; margin:0 0 2px;}
.panel-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); font-weight:700; padding:10px 10px; border-bottom:2px solid var(--line); white-space:nowrap;}
td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.desc-primary{font-weight:600;}
.desc-secondary{font-size:11.5px; color:var(--ink-soft);}
.code-chip{font-family:'IBM Plex Mono',monospace; background:var(--bg); border:1px solid var(--line); padding:3px 7px; border-radius:6px; font-size:11.5px; font-weight:600;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.badge-good{background:var(--success-soft); color:var(--success);}
.badge-warn{background:var(--warning-soft); color:var(--warning);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}
.badge-neutral{background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}

.empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.empty .big{font-size:32px; margin-bottom:8px;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(15,18,25,.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:26px 14px; overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--panel); border-radius:14px; width:100%; max-width:560px; padding:0; overflow:hidden;}
.modal.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:16px; font-weight:800;}
.modal-body{padding:20px; max-height:74vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
.close-x{background:none; border:none; font-size:18px; color:var(--ink-soft); width:30px; height:30px; border-radius:8px;}
.close-x:hover{background:var(--bg);}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--ink);}
.field .hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:#fff; color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:520px){.field-row{grid-template-columns:1fr;}}

/* ---------- scanner ---------- */
.scanner-box{background:#0d1117; border-radius:12px; overflow:hidden; position:relative; margin-bottom:14px;}
#qr-reader{width:100%;}
#qr-reader video{width:100% !important; border-radius:12px;}
.scan-tip{text-align:center; color:#9aa4b2; font-size:12px; padding:10px;}
.manual-scan-row{display:flex; gap:8px;}
.manual-scan-row input{flex:1;}
.mode-tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.mode-tab{flex:1; min-width:120px; border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:12px; text-align:center; font-weight:700; font-size:12.5px;}
.mode-tab.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark2);}

.item-found{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; background:var(--bg);}
.item-found .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
.item-found .name{font-size:15px; font-weight:800; margin:3px 0;}
.item-found .sub{font-size:12px; color:var(--ink-soft);}
.stock-pill{display:inline-block; margin-top:8px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; background:#fff; border:1px solid var(--line);}

.qty-stepper{display:flex; align-items:center; gap:10px;}
.qty-stepper button{width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:17px; font-weight:700;}
.qty-stepper input{width:70px; text-align:center; font-weight:800; font-size:16px;}

.line-item{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px;}
.line-item .info{flex:1; min-width:0;}
.line-item .info .n{font-weight:700; font-size:13px;}
.line-item .info .c{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.line-item .qty{width:64px; text-align:center; padding:6px; border:1px solid var(--line); border-radius:7px;}
.line-item .rm{background:var(--danger-soft); color:var(--danger); border:none; border-radius:7px; width:30px; height:30px;}

.checkbox-row{display:flex; align-items:center; gap:8px;}

/* ---------- mobile scan page ---------- */
.phone-shell{max-width:430px; margin:0 auto;}
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.mode-btn{border:1px solid var(--line); background:#fff; border-radius:12px; padding:16px 10px; text-align:center; font-weight:700; font-size:13px;}
.mode-btn .ic{font-size:20px; display:block; margin-bottom:6px;}
.mode-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}

.print-label{width:260px; border:1px dashed #999; padding:12px; margin:0 auto 10px; text-align:center; font-family:'IBM Plex Mono',monospace;}
.print-label .pname{font-family:'Inter',sans-serif; font-weight:700; font-size:12px; margin-top:6px;}

/* ---------- toast ---------- */
#toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--sidebar); color:#fff; padding:12px 16px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.2); display:flex; align-items:center; gap:8px; max-width:320px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}

.overdue-row{background:var(--danger-soft) !important;}
.warn-row{background:var(--warning-soft) !important;}

/* responsive */
@media(max-width:960px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .view{padding:14px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  h1.page-title{font-size:20px;}
  .user-meta{display:none;}
}
.scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55;}
.scrim.show{display:block;}
</style>
</head>
<body>

<div id="app">
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="name">PT. Dokar Putra</div>
      <div class="sub">Bengkel &amp; Gudang Sparepart</div>
    </div>
    <button class="sidebar-scan" onclick="openQuickScan()">📷 Scan Barcode</button>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">v1.0 · Data sesi lokal (browser)</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="search-box">🔍 <span>Cari SKU, Part No, Barcode…</span></div>

      </div>
    </div>
    <div class="view" id="view-root"></div>
  </div>
</div>

<!-- Generic overlay for modals -->
<div class="overlay" id="overlay"><div id="overlay-content"></div></div>

<div id="toast-wrap"></div>

<script>
/* ============================= DATA (in-memory, session only) ============================= */
let ITEMS = [

  {id:'IT-7', kode:'08887-01266', d1:'Brake Cleaner & Caliper Grease Spray 400ml', d2:'Pembersih residu kampas & pelumas kaliper', kategori:'Chemical', satuan:'Can', stok:7, stokAwal:8, stokMin:10, harga:185000, lokasi:'Rak D-02 Tk.1', lemariKe:'D-02', box:'1'},
  {id:'IT-8', kode:'SST-SCAN-004', d1:'OBD-II Diagnostic Scanner Launch X431 Pro', d2:'Alat diagnostik komputer ECU', kategori:'SST Tools', satuan:'Unit', stok:1, stokAwal:1, stokMin:1, harga:4500000, lokasi:'Lemari SST-01', lemariKe:'SST-01', box:'-', isTool:true},

];

let MEKANIK = [
  {id:'MEK-01', nama:'Budi Pratama', grade:'Foreman', bay:'Bay 1', status:'Aktif'},

  {id:'MEK-11', nama:'Agus Susanto', grade:'Mekanik Umum', bay:'Bay 4', status:'Aktif'},
  {id:'MEK-14', nama:'Dedi Kurniawan', grade:'Asisten Mekanik', bay:'Bay 1', status:'Aktif'},

let INCOMING = [
  {id:'IN-0001', tanggal:'2026-09-08', vendor:'PT Astra Otoparts Tbk', invoice:'INV-AO-8849102', poNo:'PO-DPM-2026-108', items:[{kode:'04465-0K140', qty:10, harga:420000}], total:4200000},
];
let OUTGOING = [
  {id:'OUT-0117', tanggal:'2026-09-10', spk:'SPK-2026-0891', noPol:'B 1928 DKM', tipeMobil:'Toyota Innova Reborn 2.4 G A/T', customer:'PT. Anugerah Logistik Express', mekanikId:'MEK-03', km:68450,
   items:[{kode:'04465-0K140', qty:1, harga:585000},{kode:'08880-83389', qty:1, harga:620000},{kode:'90915-YZZE1', qty:1, harga:95000},{kode:'08887-01266', qty:1, harga:185000}], total:1485000},
];
let BORROWS = [
  {id:'BOR-0082', kode:'SST-SCAN-004', mekanikAmbilId:'MEK-03', spk:'SPK-2026-0895', waktuAmbil:daysAgoISO(4), status:'dipinjam', mekanikKembaliId:null, waktuKembali:null},

];

function daysAgoISO(n){ let d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' WIB'; }
function rupiah(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function mekanikNama(id){ const m=MEKANIK.find(x=>x.id===id); return m? m.nama : '—'; }
function findItem(kode){ return ITEMS.find(i=>i.kode.toLowerCase()===String(kode).trim().toLowerCase()); }
function itemIncomingQty(kode){ let t=0; INCOMING.forEach(tr=>tr.items.forEach(li=>{ if(li.kode.toLowerCase()===kode.toLowerCase()) t+=li.qty; })); return t; }
function itemOutgoingQty(kode){ let t=0; OUTGOING.forEach(tr=>tr.items.forEach(li=>{ if(li.kode.toLowerCase()===kode.toLowerCase()) t+=li.qty; })); return t; }
function uid(prefix){ return prefix+'-'+Math.floor(1000+Math.random()*9000); }
function genBarcode(){ return String(Math.floor(10000+Math.random()*89999))+'-'+String(Math.floor(1000+Math.random()*8999)).slice(0,5).toUpperCase(); }

/* ============================= BARCODE SCANNER (camera + foto) ============================= */
let qrScanner=null;
// Registry: setiap input scan (quickScanInput, inlineScanInput, fieldScanInput, dst) didaftarkan
// ke sebuah handler function. Ini membuat live-camera, ambil-foto, dan ketik-manual
// semuanya bermuara ke handler yang sama, tanpa bentrok antar halaman/modal.
window.__scanContexts = {};
function registerScanContext(inputId, handlerFn){ window.__scanContexts[inputId] = handlerFn; }
function dispatchScanResult(inputId, code){
  code = (code||'').trim();
  if(!code) return;
  const fn = window.__scanContexts[inputId];
  if(fn) fn(code); else toast('Konteks scan tidak ditemukan, coba muat ulang halaman ini','err');
}

function stopScanner(){
  if(qrScanner){
    try{ qrScanner.stop().then(()=>{ try{qrScanner.clear();}catch(e){} qrScanner=null; }).catch(()=>{qrScanner=null;}); }catch(e){ qrScanner=null; }
  }
}

// Dipanggil lewat tombol (butuh gesture pengguna agar prompt izin kamera lebih pasti muncul)
function startLiveScan(inputId){
  stopScanner();
  const readerEl = document.getElementById('qr-reader');
  if(!readerEl) return;
  readerEl.innerHTML='';
  const tipEl = document.getElementById('scanTip-'+inputId);
  if(tipEl) tipEl.innerHTML = '⏳ Meminta izin kamera…';
  if(typeof Html5Qrcode==='undefined'){ if(tipEl) tipEl.innerHTML='⚠️ Modul kamera gagal dimuat (perlu koneksi internet). Gunakan "Ambil Foto" atau ketik manual.'; return; }
  qrScanner = new Html5Qrcode("qr-reader");
  const config = { fps:10, qrbox:{width:260,height:140} };
  qrScanner.start({facingMode:"environment"}, config,
    (decodedText)=>{ stopScanner(); dispatchScanResult(inputId, decodedText); },
    ()=>{ /* abaikan error per-frame, ini normal saat belum ketemu barcode */ }
  ).then(()=>{
    if(tipEl) tipEl.innerHTML='🔎 Arahkan kamera ke barcode…';
  }).catch(err=>{
    const reason = (err && err.message) ? err.message : String(err);
    if(tipEl) tipEl.innerHTML = `⚠️ Kamera langsung tidak bisa diaktifkan (${escapeHtml(reason)}).<br>
      Ini sering terjadi bila halaman dibuka lewat pratinjau chat, atau browser menolak izin kamera.<br>
      <strong>Solusi:</strong> gunakan tombol "📸 Ambil Foto Barcode" di bawah — cara ini hampir selalu berhasil di HP karena membuka aplikasi kamera bawaan. Atau buka file ini langsung sebagai tab tersendiri di browser HP Anda (bukan dari dalam preview), lalu izinkan akses kamera saat diminta.`;
  });
}

// Fallback: ambil 1 foto pakai kamera bawaan HP (input file capture), lalu barcode dibaca dari foto tsb.
// Cara ini nyaris selalu berhasil karena memakai kamera native OS, bukan izin getUserMedia browser.
function handlePhotoCapture(inputEl, inputId){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value='';
  if(!file) return;
  const tipEl = document.getElementById('scanTip-'+inputId);
  if(tipEl) tipEl.innerHTML = '⏳ Membaca barcode dari foto…';
  if(typeof Html5Qrcode==='undefined'){ toast('Modul pembaca barcode belum siap, cek koneksi internet','err'); return; }
  stopScanner();
  const readerEl = document.getElementById('qr-reader');
  if(readerEl) readerEl.innerHTML='';
  const fileScanner = new Html5Qrcode("qr-reader");
  fileScanner.scanFile(file, false).then(decodedText=>{
    if(tipEl) tipEl.innerHTML='✅ Barcode terbaca dari foto';
    try{ fileScanner.clear(); }catch(e){}
    dispatchScanResult(inputId, decodedText);
  }).catch(err=>{
    if(tipEl) tipEl.innerHTML = '❌ Barcode tidak terbaca dari foto ini. Coba foto lebih dekat, terang, dan fokus — atau ketik kode secara manual di bawah.';
    try{ fileScanner.clear(); }catch(e){}
  });
}

function manualScanSubmit(inputId){
  const val=document.getElementById(inputId).value.trim();
  if(!val){ toast('Masukkan kode barcode terlebih dahulu','err'); return; }
  dispatchScanResult(inputId, val);
}

function scannerBlock(inputId){
  const photoInputId = inputId+'-photo';
  return `
  <div class="scanner-box">
    <div id="qr-reader"></div>
    <div class="scan-tip" id="scanTip-${inputId}">Tekan "Mulai Kamera Langsung", atau langsung pakai "Ambil Foto Barcode" di bawah.</div>

    <label class="btn btn-primary" style="flex:1; min-width:150px; justify-content:center; margin:0;">
      📸 Ambil Foto Barcode
      <input type="file" accept="image/*" capture="environment" style="display:none" id="${photoInputId}" onchange="handlePhotoCapture(this,'${inputId}')">

}

function handleQuickScan(code){

function itemFoundCardWithAction(item, mode){
  let actionHtml='';
  if(mode==='keluar' || mode==='masuk'){
    actionHtml = `
    <div class="field"><label>Jumlah</label>
      <div class="qty-stepper"><button onclick="stepQty(-1)">−</button><input id="qsQty" type="number" value="1" min="1"><button onclick="stepQty(1)">+</button></div>
    </div>
    ${mode==='keluar'?`<div class="field"><label>Mekanik Pengambil</label>${mekanikSelect('qsMekanik')}</div>`:''}
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="quickConfirm('${item.kode}','${mode}')">✅ Konfirmasi ${mode==='masuk'?'Barang Masuk':'Barang Keluar'}</button>`;
  } else if(mode==='pinjam'){
    actionHtml = `<div class="field"><label>Mekanik Peminjam</label>${mekanikSelect('qsMekanik')}</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="quickConfirm('${item.kode}','${mode}')">✅ Konfirmasi Peminjaman</button>`;
  } else if(mode==='kembali'){
    const b = BORROWS.find(x=>x.kode===item.kode && x.status==='dipinjam');
    if(!b){ actionHtml = `<div class="badge badge-warn">Tidak ada peminjaman aktif untuk alat ini</div>`; }
    else{
      actionHtml = `<div class="sub">Dipinjam oleh <strong>${mekanikNama(b.mekanikAmbilId)}</strong> sejak ${fmtDateTime(b.waktuAmbil)}</div>
      <div class="field" style="margin-top:10px;"><label>Dikembalikan oleh</label>${mekanikSelect('qsMekanik')}</div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="quickConfirm('${item.kode}','${mode}')">✅ Konfirmasi Pengembalian</button>`;
    }
  }
  return `<div class="item-found">
    <div class="code">${item.kode}</div>
    <div class="name">${item.d1}</div>
    <div class="sub">${item.d2||''} · ${item.lokasi||''}</div>
    ${!item.isTool?`<span class="stock-pill">Stok: ${item.stok} ${item.satuan}</span>`:''}
    <div style="margin-top:14px;">${actionHtml}</div>
  </div>`;
}
function stepQty(delta){ const el=document.getElementById('qsQty'); let v=Math.max(1,(parseInt(el.value)||1)+delta); el.value=v; }
function mekanikSelect(id){
  return `<select id="${id}">${MEKANIK.filter(m=>m.status==='Aktif').map(m=>`<option value="${m.id}">${m.nama} — ${m.grade}</option>`).join('')}</select>`;
}
function quickConfirm(kode, mode){
  const item=findItem(kode);
  const qty = document.getElementById('qsQty') ? parseInt(document.getElementById('qsQty').value)||1 : 1;
  const mekId = document.getElementById('qsMekanik') ? document.getElementById('qsMekanik').value : null;
  if(mode==='masuk'){
    item.stok += qty;
    INCOMING.unshift({id:uid('IN'), tanggal:new Date().toISOString().slice(0,10), vendor:'(Scan Cepat)', invoice:'-', items:[{kode:item.kode, qty, harga:item.harga}], total:qty*item.harga});
    toast(`✅ ${qty} ${item.satuan} "${item.d1}" ditambahkan ke stok`,'ok');
  } else if(mode==='keluar'){
    if(qty>item.stok){ toast('❌ Stok tidak mencukupi','err'); return; }
    item.stok -= qty;
    OUTGOING.unshift({id:uid('OUT'), tanggal:new Date().toISOString().slice(0,10), spk:'-', noPol:'-', tipeMobil:'-', customer:'-', mekanikId:mekId, km:0, items:[{kode:item.kode, qty, harga:item.harga}], total:qty*item.harga});
    toast(`✅ ${qty} ${item.satuan} "${item.d1}" dikeluarkan oleh ${mekanikNama(mekId)}`,'ok');
  } else if(mode==='pinjam'){
    BORROWS.unshift({id:uid('BOR'), kode:item.kode, mekanikAmbilId:mekId, spk:'-', waktuAmbil:nowISO(), status:'dipinjam', mekanikKembaliId:null, waktuKembali:null});
    toast(`🔧 "${item.d1}" dipinjam oleh ${mekanikNama(mekId)}`,'ok');
  } else if(mode==='kembali'){
    const b = BORROWS.find(x=>x.kode===item.kode && x.status==='dipinjam');
    if(b){ b.status='kembali'; b.mekanikKembaliId=mekId; b.waktuKembali=nowISO(); toast(`↩️ "${item.d1}" dikembalikan oleh ${mekanikNama(mekId)}`,'ok'); }
  }
  closeModal();
  navigate(CURRENT_VIEW);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= EXCEL EXPORT / IMPORT (format template PT. Dokar Putra Mandiri) ============================= */

// Sheet aman-untuk-array-of-arrays (AOA) supaya baris judul, baris kosong, dan baris header
// persis meniru struktur file template (baris 1-2 judul, baris 3 kosong, baris 4 header, data mulai baris 5).
function buildStockSheet(){
  const aoa = [];
  aoa.push(['', '', '', '', 'WAREHOUSE STOCK LIST']);
  aoa.push(['', '', '', '', 'PT. DOKAR PUTRA MANDIRI']);
  aoa.push([]);
  aoa.push(['', 'Lemari Ke', 'BOX', '', 'CODE / PART NO', 'DESCRIPTION 1', 'DESCRIPTION 2', 'QTY\n(awal)', 'INCOMING', 'OUTGOING', 'FINAL STOCK', 'REMARK']);
  ITEMS.forEach(i=>{
    const masuk = itemIncomingQty(i.kode);
    const keluar = itemOutgoingQty(i.kode);
    aoa.push(['', i.lemariKe||'', i.box||'', '', i.kode, i.d1, i.d2||'', (i.stokAwal!=null?i.stokAwal:i.stok), masuk, keluar, i.stok, i.stok<i.stokMin? 'Stok Menipis':'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:3},{wch:10},{wch:6},{wch:2},{wch:16},{wch:32},{wch:28},{wch:9},{wch:9},{wch:9},{wch:11},{wch:14}];
  return ws;
}
function buildIncomingSheet(){
  const aoa = [];
  aoa.push(['', 'INCOMING LIST']);
  aoa.push(['', 'PT. DOKAR PUTRA MANDIRI']);
  aoa.push([]);
  aoa.push(['', 'Date', 'CODE / PART NO', 'DESRCIPTION1', 'DESCRIPTION 2', 'QTY', 'Harga Satuan', 'Total', 'PPN 11%', 'Total Harga Sdh PPN ', 'VENDOR NAME', 'VENDOR INVOICE', 'DPM PO NO.']);
  INCOMING.forEach(tr=>{
    tr.items.forEach(li=>{
      const it=findItem(li.kode);
      const total = li.qty*li.harga;
      const ppn = Math.round(total*0.11);
      aoa.push(['', tr.tanggal, li.kode, it?it.d1:'KODE TIDAK DITEMUKAN', it?it.d2||'':'', li.qty, li.harga, total, ppn, total+ppn, tr.vendor, tr.invoice, tr.poNo||'']);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:3},{wch:12},{wch:16},{wch:26},{wch:24},{wch:6},{wch:12},{wch:12},{wch:12},{wch:16},{wch:22},{wch:16},{wch:16}];
  return ws;
}
function buildOutgoingSheet(){
  const aoa = [];
  aoa.push(['', 'OUTGOING LIST']);
  aoa.push(['', 'PT. DOKAR PUTRA MANDIRI']);
  aoa.push([]);
  aoa.push(['', 'DATE', 'CODE / PART NO', 'DESCRIPTION 1', 'DESCRIPTION 2', 'QTY', 'SPK', 'NO POL', 'TYPE MOBIL', 'CUSTOMER', 'PENGGUNA (Mekanik)', 'KM']);
  OUTGOING.forEach(tr=>{
    tr.items.forEach(li=>{
      const it=findItem(li.kode);
      aoa.push(['', tr.tanggal, li.kode, it?it.d1:'KODE TIDAK DITEMUKAN', it?it.d2||'':'', li.qty, tr.spk, tr.noPol, tr.tipeMobil, tr.customer, mekanikNama(tr.mekanikId), tr.km]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:3},{wch:12},{wch:16},{wch:28},{wch:22},{wch:6},{wch:14},{wch:12},{wch:26},{wch:24},{wch:18},{wch:9}];
  return ws;
}
function exportItemsExcel(){
  const wb = XLSX.utils.book_new();

function exportBorrowExcel(){
  const rows = BORROWS.map(b=>{
    const it=findItem(b.kode);
    return {'No Transaksi':b.id,'Barcode':b.kode,'Nama Alat':it?it.d1:'','Dipinjam Oleh':mekanikNama(b.mekanikAmbilId),'Waktu Ambil':fmtDateTime(b.waktuAmbil),'Dikembalikan Oleh':b.mekanikKembaliId?mekanikNama(b.mekanikKembaliId):'-','Waktu Kembali':b.waktuKembali?fmtDateTime(b.waktuKembali):'-','Status':b.status};
  });
  if(!rows.length){ toast('Tidak ada data untuk diekspor','err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Peminjaman & Kembali'.slice(0,31));
  XLSX.writeFile(wb, 'Peminjaman_Alat.xlsx');
  toast('📥 File Excel berhasil diunduh: Peminjaman_Alat.xlsx','ok');
}

// ---- Import: baca file dengan format template (header boleh ada di baris berapa saja,
// terdeteksi otomatis dengan mencari baris yang mengandung "CODE / PART NO"). ----
function normHeader(s){ return String(s==null?'':s).replace(/\n/g,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
function findHeaderRow(aoa, mustContain){
  for(let r=0;r<aoa.length;r++){
    const cells = (aoa[r]||[]).map(normHeader);
    if(cells.some(c=>c.includes(mustContain))) return r;
  }
  return -1;
}
function colMapFromHeader(headerRow){
  const map={};
  headerRow.forEach((c,idx)=>{ const n=normHeader(c); if(n) map[n]=idx; });
  return map;
}
function pick(map, row, ...candidates){
  for(const c of candidates){ if(map[c]!=null && row[map[c]]!=null && row[map[c]]!=='') return row[map[c]]; }
  return '';
}

function importTemplateExcel(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      let addedItem=0, updatedItem=0, addedIn=0, addedOut=0;

      // --- Sheet Stok (nama sheet mengandung "stock") ---
      const stockSheetName = wb.SheetNames.find(n=>/stock/i.test(n));
      if(stockSheetName){
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[stockSheetName], {header:1, defval:''});
        const hRow = findHeaderRow(aoa, 'code / part no');
        if(hRow>=0){
          const map = colMapFromHeader(aoa[hRow]);
          for(let r=hRow+1; r<aoa.length; r++){
            const row = aoa[r]; if(!row || !row.length) continue;
            const kode = pick(map,row,'code / part no');
            if(!kode) continue;
            const d1 = pick(map,row,'description 1');
            const d2 = pick(map,row,'description 2');
            const stokAwal = parseFloat(pick(map,row,'qty (awal)','qty awal','qty'))||0;
            const masuk = parseFloat(pick(map,row,'incoming'))||0;
            const keluar = parseFloat(pick(map,row,'outgoing'))||0;
            let finalStock = pick(map,row,'final stock');
            finalStock = finalStock===''? (stokAwal+masuk-keluar) : parseFloat(finalStock)||0;
            const lemariKe = pick(map,row,'lemari ke');
            const box = pick(map,row,'box');
            let existing = findItem(kode);
            if(existing){
              existing.stok = finalStock; existing.stokAwal = stokAwal;
              existing.d1 = d1||existing.d1; existing.d2 = d2||existing.d2;
              existing.lemariKe = lemariKe||existing.lemariKe; existing.box = box||existing.box;
              updatedItem++;
            } else {
              ITEMS.push({id:uid('IT'), kode:String(kode), d1:d1||String(kode), d2, kategori:'Umum', satuan:'Pcs', stok:finalStock, stokAwal, stokMin:5, harga:0, lokasi:[lemariKe,box].filter(Boolean).join(' / '), lemariKe, box});
              addedItem++;
            }
          }
        }
      }

      // --- Sheet Incoming (opsional, kalau ada di file yang sama) ---
      const inSheetName = wb.SheetNames.find(n=>/incoming/i.test(n));
      if(inSheetName){
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[inSheetName], {header:1, defval:''});
        const hRow = findHeaderRow(aoa, 'code / part no');
        if(hRow>=0){
          const map = colMapFromHeader(aoa[hRow]);
          for(let r=hRow+1; r<aoa.length; r++){
            const row=aoa[r]; if(!row || !row.length) continue;
            const kode = pick(map,row,'code / part no'); if(!kode) continue;
            const qty = parseFloat(pick(map,row,'qty'))||0; if(!qty) continue;
            const harga = parseFloat(pick(map,row,'harga satuan'))||0;
            INCOMING.unshift({
              id:uid('IN'),
              tanggal: pick(map,row,'date')||new Date().toISOString().slice(0,10),
              vendor: pick(map,row,'vendor name')||'-',
              invoice: pick(map,row,'vendor invoice')||'-',
              poNo: pick(map,row,'dpm po no.')||'-',
              items:[{kode:String(kode), qty, harga}],
              total: qty*harga
            });
            addedIn++;
          }
        }
      }

      // --- Sheet Outgoing (opsional) ---
      const outSheetName = wb.SheetNames.find(n=>/outgoing/i.test(n));
      if(outSheetName){
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[outSheetName], {header:1, defval:''});
        const hRow = findHeaderRow(aoa, 'code / part no');
        if(hRow>=0){
          const map = colMapFromHeader(aoa[hRow]);
          for(let r=hRow+1; r<aoa.length; r++){
            const row=aoa[r]; if(!row || !row.length) continue;
            const kode = pick(map,row,'code / part no'); if(!kode) continue;
            const qty = parseFloat(pick(map,row,'qty'))||0; if(!qty) continue;
            const it = findItem(kode);
            const mekNamaStr = pick(map,row,'pengguna (mekanik)');
            const mek = MEKANIK.find(m=>m.nama.toLowerCase()===String(mekNamaStr).toLowerCase());
            OUTGOING.unshift({
              id:uid('OUT'),
              tanggal: pick(map,row,'date')||new Date().toISOString().slice(0,10),
              spk: pick(map,row,'spk')||'-',
              noPol: pick(map,row,'no pol')||'-',
              tipeMobil: pick(map,row,'type mobil')||'-',
              customer: pick(map,row,'customer')||'-',
              mekanikId: mek? mek.id : null,
              km: parseFloat(pick(map,row,'km'))||0,
              items:[{kode:String(kode), qty, harga: it?it.harga:0}],
              total: qty*(it?it.harga:0)
            });
            addedOut++;
          }
        }
      }

      if(!addedItem && !updatedItem && !addedIn && !addedOut){
        toast('❌ Tidak ditemukan data yang sesuai format template. Pastikan header "CODE / PART NO" ada di sheet.','err');
      } else {
        toast(`✅ Import selesai — Stok: ${addedItem} baru/${updatedItem} update, Incoming: ${addedIn} baris, Outgoing: ${addedOut} baris`,'ok');
      }
      navigate(CURRENT_VIEW==='laporan'?'laporan':'barang');
    }catch(err){ toast('❌ Gagal membaca file Excel: '+err.message,'err'); }
  };
  reader.readAsArrayBuffer(file);
  fileInput.value='';
}

function updateBulkDeleteBar(){

  if(countEl) countEl.textContent=n;

function confirmBulkDeleteItems(){
  const ids=[...selectedItemIds];

  const items = ITEMS.filter(i=>ids.includes(i.id));

  if(usedAny){
    warn = `<div class="badge badge-warn" style="display:block;margin-top:10px;padding:10px;">⚠️ Sebagian barang punya riwayat transaksi (masuk/keluar/peminjaman). Riwayat lama akan tetap ada tapi akan tertulis "KODE TIDAK DITEMUKAN" pada laporan.</div>`;

  openModal(`

    <div class="modal-body">

function addToMasukCart(kode){
  kode=(kode||'').trim(); if(!kode) return;
  const item=findItem(kode);
  if(!item){ toast('❌ Barang dengan kode "'+kode+'" tidak ditemukan','err'); return; }
  masukCart.push({kode:item.kode, qty:1, harga:item.harga});
  document.getElementById('mScanInput').value='';
  renderMasukCart();
}
function renderMasukCart(){
  document.getElementById('masukCartList').innerHTML = masukCart.map((li,idx)=>{
    const it=findItem(li.kode);
    return `<div class="line-item">
      <div class="info"><div class="n">${it.d1}</div><div class="c">${li.kode}</div></div>
      <input class="qty" type="number" value="${li.qty}" min="1" onchange="masukCart[${idx}].qty=parseFloat(this.value)||1">
      <button class="rm" onclick="masukCart.splice(${idx},1); renderMasukCart();">✕</button>
    </div>`;
  }).join('') || `<div class="empty" style="padding:16px;">Belum ada item — scan barcode untuk menambah</div>`;
}
function saveMasuk(){
  if(!masukCart.length){ toast('Tambahkan minimal 1 barang','err'); return; }
  const total = masukCart.reduce((s,li)=>s+li.qty*li.harga,0);
  INCOMING.unshift({id:uid('IN'), tanggal:document.getElementById('mTanggal').value, vendor:document.getElementById('mVendor').value||'-', invoice:document.getElementById('mInvoice').value||'-', poNo:document.getElementById('mPoNo').value||'-', items:[...masukCart], total});
  masukCart.forEach(li=>{ const it=findItem(li.kode); it.stok += li.qty; });
  toast('✅ Barang masuk tersimpan & stok diperbarui','ok');
  navigate('masuk');
}

        <div id="keluarCartList"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:10px;" onclick="saveKeluar()">✅ Konfirmasi Pengeluaran &amp; Potong Stok</button>

function addToKeluarCart(kode){
  kode=(kode||'').trim(); if(!kode) return;
  const item=findItem(kode);
  if(!item){ toast('❌ Barang dengan kode "'+kode+'" tidak ditemukan','err'); return; }
  if(item.stok<=0){ toast('⚠️ Stok "'+item.d1+'" habis','err'); return; }
  keluarCart.push({kode:item.kode, qty:1, harga:item.harga});
  document.getElementById('kScanInput').value='';
  renderKeluarCart();
}
function renderKeluarCart(){
  document.getElementById('keluarCartList').innerHTML = keluarCart.map((li,idx)=>{
    const it=findItem(li.kode);
    return `<div class="line-item">
      <div class="info"><div class="n">${it.d1}</div><div class="c">${li.kode} · Stok: ${it.stok} ${it.satuan}</div></div>
      <input class="qty" type="number" value="${li.qty}" min="1" max="${it.stok}" onchange="keluarCart[${idx}].qty=parseFloat(this.value)||1">
      <button class="rm" onclick="keluarCart.splice(${idx},1); renderKeluarCart();">✕</button>
    </div>`;
  }).join('') || `<div class="empty" style="padding:16px;">Belum ada item — scan barcode untuk menambah</div>`;
}
function saveKeluar(){
  if(!keluarCart.length){ toast('Tambahkan minimal 1 barang','err'); return; }
  for(const li of keluarCart){ const it=findItem(li.kode); if(li.qty>it.stok){ toast('❌ Qty "'+it.d1+'" melebihi stok tersedia','err'); return; } }
  const total = keluarCart.reduce((s,li)=>s+li.qty*li.harga,0);
  OUTGOING.unshift({id:uid('OUT'), tanggal:new Date().toISOString().slice(0,10), spk:document.getElementById('kSpk').value||'-', noPol:document.getElementById('kNoPol').value||'-', tipeMobil:document.getElementById('kTipe').value||'-', customer:document.getElementById('kCustomer').value||'-', mekanikId:document.getElementById('kMekanik').value, km:parseFloat(document.getElementById('kKm').value)||0, items:[...keluarCart], total});
  keluarCart.forEach(li=>{ const it=findItem(li.kode); it.stok -= li.qty; });
  toast('✅ Barang keluar tersimpan & stok dipotong','ok');
  navigate('keluar');
}

/* inline scanner used inside masuk/keluar forms */
function openInlineScanner(targetInputId, onFound){
  openModal(`
    <div class="modal-head"><h3>📷 Scan Barcode</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${scannerBlock('inlineScanInput')}</div>
  `);

    const targetEl = document.getElementById(targetInputId);
    if(targetEl) targetEl.value=code;
    closeModal();
    onFound(code);
  });
}

      <div class="card stat-card"><div class="label">Total Keluar (Semua Transaksi)</div><div class="value">${rupiah(totalKeluarBulanIni)}</div></div>
    </div>

    <div class="card">
      <div class="panel-title">📄 Format Template Asli Bengkel (MASTER_STOCK_LIST.xlsx)</div>
      <div class="panel-sub">Satu file Excel berisi 3 sheet (STOCK LIST, INCOMING, OUTGOING) — persis format yang biasa dipakai bengkel.</div>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="exportMasterTemplateExcel()">⬇️ Export MASTER_STOCK_LIST.xlsx (3 Sheet)</button>
        <label class="btn" style="margin:0;">⬆️ Import dari MASTER_STOCK_LIST.xlsx<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importTemplateExcel(this)"></label>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="panel-title">Ekspor per Sheet</div>
      <div class="panel-sub">Unduh masing-masing sheet secara terpisah kalau hanya butuh salah satu.</div>
      <div class="toolbar">
        <button class="btn btn-dark" onclick="exportItemsExcel()">⬇️ STOCK LIST</button>
        <button class="btn btn-dark" onclick="exportIncomingExcel()">⬇️ INCOMING</button>
        <button class="btn btn-dark" onclick="exportOutgoingExcel()">⬇️ OUTGOING</button>
        <button class="btn btn-dark" onclick="exportBorrowExcel()">⬇️ Peminjaman Alat</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="panel-title">Mutasi Kartu Stok</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Part No &amp; Barcode</th><th>Lemari / BOX</th><th>Qty Awal</th><th>Masuk</th><th>Keluar</th><th>Stok Akhir</th><th>Total Valuasi</th></tr></thead>
        <tbody>${ITEMS.map(i=>`<tr><td><div class="desc-primary">${i.d1}</div><span class="code-chip">${i.kode}</span></td><td>${i.lemariKe||'-'} / ${i.box||'-'}</td><td>${i.stokAwal!=null?i.stokAwal:'-'}</td><td>${itemIncomingQty(i.kode)}</td><td>${itemOutgoingQty(i.kode)}</td><td>${i.stok} ${i.satuan}</td><td>${rupiah(i.stok*i.harga)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

  `;
}
